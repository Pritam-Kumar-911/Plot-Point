    const genres = [
    'Drama', 'Animation', 'Romance', 'Fantasy', 'Adventure',
    'Action', 'Comedy', 'Crime', 'Thriller', 'Family',
    'Science Fiction', 'War', 'Mystery', 'History', 'Music'
    ];

function createGenreSection(genreName) {
    const rowId = `row-${genreName.replace(/\s+/g, '-').toLowerCase()}`;

    const section = document.createElement('section');
    section.className = 'genre-section';
    section.innerHTML = `
        <div class="flex items-center mb-5">
            <span class="genre-line"></span>
            <h2 class="font-display text-lg tracking-widest text-primary uppercase">${genreName}</h2>
        </div>
        <div class="flex gap-gutter overflow-x-auto no-scrollbar pb-4 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0" id="${rowId}"></div>
    `;

    document.getElementById('genreContainer').appendChild(section);
    return rowId;
}

function renderMovieCards(movies, rowId) {
    const row = document.getElementById(rowId);

    movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card flex-none w-[160px] md:w-[180px] group cursor-pointer';
        card.innerHTML = `
            <div class="poster-container relative aspect-[2/3] rounded-[10px] overflow-hidden border border-outline-variant bg-surface-container-high mb-2">
                <img src="${movie.poster_url}" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'"/>
                <div class="absolute top-2 right-2 flex items-center gap-0.5 bg-black/40 backdrop-blur-sm px-1.5 py-0.5 rounded-full border border-white/10">
                    <span class="material-symbols-outlined text-[10px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="text-[10px] font-bold text-on-surface">${movie.rating}</span>
                </div>
            </div>
            <h3 class="text-xs font-medium text-on-surface truncate px-0.5">${movie.title}</h3>
        `;
        card.onclick = () => window.location.href = `detail.html?id=${movie.movie_id}`;
        row.appendChild(card);
    });
}

async function fetchMovieCards() {
    for (const genre of genres) {
        const result = await fetch(`http://168.144.84.3:5000/api/explore/${genre}`);
        const movies = await result.json();

        if (movies.length === 0) continue;

        const rowId = createGenreSection(genre);
        renderMovieCards(movies, rowId);
    }
}
